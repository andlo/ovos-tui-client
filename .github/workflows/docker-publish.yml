name: Publish Docker image

# Companion image for ovos-tui-client - see issue #23 and the README's
# "Docker/Podman companion image" section. Mirrors publish.yml's own
# trigger/test-first structure so both release artifacts (PyPI package,
# container image) get built from the exact same tagged commit and
# neither ships without tests passing first.

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # Pre-releases (e.g. v0.2.0a1, v0.2.0b1, v0.2.0rc1) get ONLY their
          # own version tag - never :latest, so anyone running the companion
          # image as :latest keeps the last real release. Mirrors PyPI, where
          # pip ignores pre-releases unless asked (--pre).
          if [[ "$VERSION" =~ (a|b|rc)[0-9]+$ ]]; then
            echo "tags=ghcr.io/${{ github.repository_owner }}/ovos-tui-client:${VERSION}" >> "$GITHUB_OUTPUT"
          else
            {
              echo "tags<<EOF"
              echo "ghcr.io/${{ github.repository_owner }}/ovos-tui-client:${VERSION}"
              echo "ghcr.io/${{ github.repository_owner }}/ovos-tui-client:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.version.outputs.tags }}

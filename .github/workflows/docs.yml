name: Docs

# PRs: regenerate the screenshots, check they match what's committed,
# and build the site strictly (broken links/missing pages fail).
# main: the same, then publish to GitHub Pages.
on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "scripts/make_screenshots.py"
      - "scripts/build_docs.sh"
      - "ovos_tui_client/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .[docs]
      - name: Screenshots + build
        run: scripts/build_docs.sh check
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
